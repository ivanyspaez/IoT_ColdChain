{% extends "base.html" %}

{% block title %}Ingresar - ColdChain{% endblock %}
{% block header_title %}ColdChain Dashboard{% endblock %}
{% block header_subtitle %}Acceso al sistema de cadena de frío{% endblock %}

{% block content %}
<section class="auth-grid">
  <div class="panel">
    <h2>Registro</h2>
    <form method="post" action="/register" class="form">
      <label>Usuario</label>
      <input type="text" name="username" required>

      <label>Contraseña</label>
      <input type="password" name="password" required>

      <button type="submit">Crear cuenta</button>
    </form>
  </div>

  <div class="panel">
    <h2>Ingreso</h2>
    <form method="post" action="/login" class="form">
      <label>Usuario</label>
      <input type="text" name="username" required>

      <label>Contraseña</label>
      <input type="password" name="password" required>

      <button type="submit">Entrar</button>
    </form>
  </div>
</section>
{% endblock %}
